[project]
name = "semibreve"
version = "0.0.1"
description = "System-wide audio processing for Linux, on FxSound's DSP"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "dbus-python>=1.3",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
]

[project.scripts]
semibreve = "semibreve.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["semibreve*"]

# Note: no ext_modules here, deliberately.
#
# The DSP is built by ./build.sh into build/libdfxdsp.so and linked into the
# semibreved daemon. The Python side never loads it: the window talks to the
# daemon over D-Bus, so there are no bindings and no build step here.
#
# The app is not pip-installed either — bin/semibreve runs it straight from the
# checkout, against Fedora's PySide6: that one uses the desktop's own Qt, which
# is what gives a native Wayland window and KDE theming, where a PyPI wheel
# bundles a Qt of its own. This file exists for metadata and to list the
# dependencies.
