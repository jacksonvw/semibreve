[project]
name = "semibreve"
version = "0.0.1"
description = "System-wide audio processing for Linux, on FxSound's DSP"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
linux = [
    "dbus-python>=1.3",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
semibreve = "semibreve.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["semibreve*"]

# Note: no ext_modules here, deliberately.
#
# The DSP is built by ./build.sh into build/libdfxdsp.so and loaded with
# ctypes, the same way semibreve/core/blur.py loads libKF6WindowSystem — no
# bindings and no build step on the Python side.
#
# Routing it through a setuptools Extension was considered and dropped: it
# would require python3-setuptools, which is not installed. The app is not
# pip-installed either — bin/semibreve runs it straight from the checkout.
# This file exists for metadata and to list the dependencies.
